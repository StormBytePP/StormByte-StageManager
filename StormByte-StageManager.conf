# Configuration file for StormByte Stage Manager
# /etc/conf.d/StormByte-StageManager.conf  (or alongside the script)

# Full path where stage tarballs are stored
TARBALL_FOLDER="/var/lib/StormByte-StageManager/stages"

# Storage backend for the temporary stage tree:
#   folder  – plain directory under /tmp
#   tmpfs   – RAM-backed filesystem (requires STORAGE_SIZE)
#   zram    – compressed RAM block device (requires STORAGE_SIZE)
#   auto    – try zram, then tmpfs, then folder
STORAGE_SYSTEM="auto"

# Zram compression algorithm when STORAGE_SYSTEM=zram:
#   zstd, lz4, lz4hc  – or leave empty for the kernel default
STORAGE_SYSTEM_ZRAM_COMPRESSION_ALGO="zstd"

# Size for tmpfs / zram (and default size for shared FILE cache workspaces).
# Examples: 20G, 512M
STORAGE_SIZE="20G"

# Editor used by: StormByte-StageManager notes <stage> edit
TARBALL_NOTE_EDITOR="/bin/nano"

# YES = detach editor from the terminal (useful for GUI editors)
DETACH_NOTE_EDITOR="NO"

# Compression levels for stage (re)compress paths
# gzip / bzip2 / xz: 1–9
GZIP_COMPRESSION_LEVEL="9"
BZIP_COMPRESSION_LEVEL="9"
XZ_COMPRESSION_LEVEL="9"
# zstd: 1–19
ZSTD_COMPRESSION_LEVEL="19"

# =============================================================================
# Compiler caches (ccache / sccache)
# =============================================================================
# Exactly one of BIND or FILE must be YES when the corresponding USE_*=YES.
#
# BIND – mount the host directory into the stage (shared by nature).
# FILE – pack/unpack a sidecar under TARBALL_FOLDER (ccache.tbz2 / sccache.tbz2)
#        through a shared tmpfs workspace so concurrent "use"/"rebase" sessions
#        share one hot cache. The last session to exit packs the sidecar even if
#        stage changes are not saved.
#
# Cache size vs FILE workspace:
#   When USE_*_FILE=YES, *CACHE_SIZE must not exceed the workspace size
#   (*_TMPFS_SIZE, or STORAGE_SIZE, or 8G as last fallback).
#
# Config names (symmetric):
#   CCACHE_CACHE_SIZE  → exported into the chroot as CCACHE_MAXSIZE (ccache API)
#   SCCACHE_CACHE_SIZE → exported as SCCACHE_CACHE_SIZE (sccache API; default 20G)
#
# Runtime / optional overrides (defaults shown):
#   CCACHE_SHARE_ROOT=/tmp/StormByte-ccache
#   SCCACHE_SHARE_ROOT=/tmp/StormByte-sccache
#   CACHE_LOCK_DIR=/tmp/StormByte-cache-locks
#   CCACHE_TMPFS_SIZE=<STORAGE_SIZE or 8G>
#   SCCACHE_TMPFS_SIZE=<STORAGE_SIZE or 8G>
#   SKIP_CACHE=1   (skip FILE acquire/pack for one run)
# =============================================================================

# --- ccache ---
USE_CCACHE="NO"
CCACHE_DIR="/var/cache/ccache"
USE_CCACHE_BIND="NO"
USE_CCACHE_FILE="NO"

# Optional: max ccache size inside the chroot (e.g. 8G, 512M).
# Leave unset for ccache's built-in default. Must be ≤ FILE workspace when FILE=YES.
# CCACHE_CACHE_SIZE="8G"

# Optional shared FILE workspace overrides (leave unset to use defaults)
# CCACHE_SHARE_ROOT="/tmp/StormByte-ccache"
# CCACHE_TMPFS_SIZE="8G"

# --- sccache ---
USE_SCCACHE="NO"
SCCACHE_DIR="/var/cache/sccache"
USE_SCCACHE_BIND="NO"
USE_SCCACHE_FILE="NO"

# Optional: sccache disk budget inside the chroot (default 20G if unset).
# Must be ≤ FILE workspace when FILE=YES.
# SCCACHE_CACHE_SIZE="20G"

# Optional shared FILE workspace overrides
# SCCACHE_SHARE_ROOT="/tmp/StormByte-sccache"
# SCCACHE_TMPFS_SIZE="8G"

# Shared lock/holder directory for FILE mode (both caches)
# CACHE_LOCK_DIR="/tmp/StormByte-cache-locks"

# =============================================================================
# Host bind mounts inside the chroot
# =============================================================================

# Binary packages (PKGDIR)
PKG_DIR="/var/cache/binpkgs"
USE_PKG_BIND="NO"

# Distfiles
DISTFILES_DIR="/var/cache/distfiles"
USE_DISTFILES_BIND="NO"

# Gentoo ebuild repository
REPOS_DIR="/var/db/repos/gentoo"
USE_REPOS_BIND="NO"

# Bind host /etc/portage/patches when YES and the path exists
USE_GENTOO_PATCHES_BIND="NO"

# Semicolon-separated absolute host paths to bind into the chroot (must exist).
# Protected roots (/ , /dev, /sys, …) are rejected.
# Example: EXTRA_BIND_MOUNT="/opt/tools;/srv/data"
EXTRA_BIND_MOUNT=""

# Optional checksum for virtual filesystems (crc32c, xxhash, sha256, blake2).
# Defaults to crc32c if unset.
BTRFS_CHECKSUM="crc32c"